[package]
name = "myndgera"
version = "0.2.0"
edition = "2024"

[dependencies]
ash = "0.38"
ash-window = "0.13"
winit = "0.30"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ahash = "0.8"
notify-debouncer-full = "0.6"
parking_lot = "0.12"
notify = { version = "8.1", features = ["crossbeam-channel"] }
shaderc = "0.10"
either = "1.15"
slotmap = "1.0.7"
gpu-allocator = { version = "0.28", default-features = false, features = ["std", "vulkan"] }
ddsfile = "0.5"
pretty-type-name = "1.0"
glam = { version = "0.30", features = ["bytemuck", "mint", "rand"] }
dolly = "0.6.0"
bytemuck = { version = "1.23.0", features = ["derive"] }
rand = "0.9"
crossbeam-channel = "0.5"
chrono = "0.4"
png = "0.18"
arrayvec = "0.7.6"

[profile.deploy]
inherits = "release"
lto = true

[profile.dev.package.'*']
opt-level = 3
